name: Build SIREP OASIS NEXUS WEFEH Paper PDF

on:
  push:
    paths:
      - "paper/**"
  pull_request:
    paths:
      - "paper/**"

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Compile LaTeX paper
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error SIREP-OASIS-NEXUS-WEFEH.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIREP-OASIS-NEXUS-WEFEH-paper
          path: paper/SIREP-OASIS-NEXUS-WEFEH.pdf
