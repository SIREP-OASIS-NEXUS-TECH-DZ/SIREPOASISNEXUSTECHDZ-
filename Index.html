<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦅 هدهد SIREP سليمان + تسبيح</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="header">🦅 هدهد SIREP سليمان</div>
<div class="ayat">"ألا تعلوا علي وأتوني مسلمين" 🕋</div>

<div class="tasbih" id="tasbihCounter">سبحان الله <span id="count">0</span>/100</div>
<div class="profit">💰 <span id="profitCounter">1.52M</span> دج/شهر</div>

<div class="stats">
<div class="stat">🏜️<br><b>720kWh/يوم</b></div>
<div class="stat">🤖<br><b>/umra /siyakh</b></div>
<div class="stat">👶<br><b>56 أسرة تكافل</b></div>
<div class="stat">🕌<br><b>تسبيح 100×</b></div>
</div>

<button class="btn" onclick="tasbihClick()">🌟 سبحان الله +1</button>
<button class="btn" onclick="resetTasbih()">🔄 إعادة تسبيح</button>

<div>
<a href="https://t.me/SIREP_Hudhud_bot" class="bot-link" target="_blank">🤖 هدهد Bot: /umra /siyakh</a>
</div>

<button class="btn" onclick="alert('💳 بريدي موب 20K فوري
✅ بسم الله الرحمن الرحيم')">💳 بريدي موب</button>
<button class="btn" onclick="alert('🏜️ الواحة Live
720kWh + 58طن غذاء')">🏜️ الواحة Live</button>

<script>
let tasbihCount=localStorage.getItem('tasbih')||0;
document.getElementById('count').textContent=tasbihCount;

function tasbihClick(){
  tasbihCount++;
  localStorage.setItem('tasbih',tasbihCount);
  document.getElementById('count').textContent=tasbihCount;
  if(tasbihCount>=100) alert('🎉 تكملة تسبيح 100×
بارك الله فيك
💰 بركة في الرزق');
}

function resetTasbih(){
  tasbihCount=0;
  localStorage.setItem('tasbih',0);
  document.getElementById('count').textContent=0;
}

setInterval(()=>{
  let profit=1.52+Math.sin(Date.now()/5000)*0.1;
  document.getElementById('profitCounter').textContent=profit.toFixed(2)+'M';
},1500);
</script>
</body>
</html>
